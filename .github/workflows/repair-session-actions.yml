name: repair-session-actions
on:
  push:
    branches: [pos-repair]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
      - name: Remove impossible session actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SessionsPage.tsx')
          s=p.read_text()
          s=s.replace('(status === "pending" || status === "completed")', '(status === "pending")')
          s=s.replace('{status !== "pending" && (', '{false && (')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/SessionsPage.tsx
          git diff --cached --quiet || git commit -m "fix: remove impossible session actions"
          git push origin pos-repair
