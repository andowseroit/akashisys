name: repair-reports
on:
  push:
    branches: [pos-repair]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
      - name: Replace report data path with authoritative analytics view
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/ReportsPage.tsx')
          s=p.read_text()
          helper='''\nfunction colomboDate(offsetDays = 0) {\n  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Colombo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());\n  const y = Number(parts.find(p => p.type === "year")?.value);\n  const m = Number(parts.find(p => p.type === "month")?.value);\n  const d = Number(parts.find(p => p.type === "day")?.value);\n  return new Date(Date.UTC(y, m - 1, d + offsetDays)).toISOString().slice(0, 10);\n}\n'''
          if 'function colomboDate(' not in s:
              s=s.replace('import autoTable from "jspdf-autotable";\n', 'import autoTable from "jspdf-autotable";\n'+helper)
          pattern=r'  async function generateReport\(\) \{.*?\n  \}\n\n  function downloadPDF'
          replacement='''  async function generateReport() {\n    setIsLoading(true);\n    try {\n      const today = colomboDate();\n      let startDate: string;\n      if (period === "daily") startDate = today;\n      else if (period === "weekly") startDate = colomboDate(-6);\n      else {\n        const [y, m] = today.split("-").map(Number);\n        startDate = new Date(Date.UTC(y, m - 1, 1)).toISOString().slice(0, 10);\n      }\n\n      const { data: days, error } = await supabase\n        .from("daily_analytics")\n        .select("day,revenue,collected,expenses,return_loss,net_deposit")\n        .gte("day", startDate)\n        .lte("day", today)\n        .order("day", { ascending: true });\n      if (error) throw error;\n\n      const rows = days || [];\n      const totalRevenue = rows.reduce((sum, row) => sum + Number(row.revenue || 0), 0);\n      const totalCollected = rows.reduce((sum, row) => sum + Number(row.collected || 0), 0);\n      const totalExpenses = rows.reduce((sum, row) => sum + Number(row.expenses || 0), 0);\n      const totalLosses = rows.reduce((sum, row) => sum + Number(row.return_loss || 0), 0);\n      const netDeposit = rows.reduce((sum, row) => sum + Number(row.net_deposit || 0), 0);\n      setReportData({ totalRevenue, totalCollected, totalExpenses, totalLosses, netDeposit });\n    } catch (err) {\n      console.error("Failed to generate report:", err);\n      setReportData(null);\n      alert("Error generating report");\n    } finally {\n      setIsLoading(false);\n    }\n  }\n\n  function downloadPDF'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'expected generateReport block, replaced {n}')
          p.write_text(ns)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ReportsPage.tsx
          git diff --cached --quiet || git commit -m "fix: make reports timezone-safe and void-aware"
          git push origin pos-repair
