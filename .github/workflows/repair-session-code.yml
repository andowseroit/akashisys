name: Repair session frontend

on:
  push:
    paths:
      - '.github/workflows/repair-session-code.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
          fetch-depth: 0

      - name: Patch SessionsPage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/pages/SessionsPage.tsx")
          text = path.read_text()

          # Replace the entire fetchAllSessions function up to the first useEffect.
          pattern = r"  async function fetchAllSessions\(\) \{.*?\n  \}\n\n  useEffect\(\(\) => \{ loadData\(\); \}, \[\]\);"
          replacement = """  async function fetchAllSessions() {
            const { data, error } = await supabase
              .from("route_sessions")
              .select("*")
              .order("session_date", { ascending: false })
              .order("created_at", { ascending: false });
            if (error) throw error;
            return data || [];
          }

          useEffect(() => { loadData(); }, []);"""
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"fetchAllSessions replacement failed: {n}")

          # Remove stale date-field autodetection call if present.
          text, n = re.subn(
              r"      // Determine which field route_sessions uses for the session date\n      await getSessionDateField\(\);\n\n",
              "",
              text,
              count=1,
          )

          # Make loadData keep the session it just fetched/created instead of reading stale React state.
          pattern = r"      // Load today's session from route_sessions table\n      const existing = await fetchSessionForDate\(today\);\n\n      if \(existing\) \{.*?\n      \}")
          replacement = """      // Load today's session from route_sessions table
            const existing = await fetchSessionForDate(today);
            const sessionForToday = existing || await insertSession("pending");
            setTodaySession(sessionForToday);"""
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"loadData session replacement failed: {n}")

          # The first truck-load query must use the local session object, not stale state.
          text, n = re.subn(
              r"\.eq\(\"session_id\", todaySession\?\.id\);",
              '.eq("session_id", sessionForToday.id);',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"truck load query replacement failed: {n}")

          text = text.replace(
              '  const [sessionDateField, setSessionDateField] = useState<"date" | "session_date" | null>(null);\n',
              '',
              1,
          )

          path.write_text(text)
          print("SessionsPage repair pass completed")
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SessionsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete session frontend repair"
          git push origin HEAD:pos-repair
