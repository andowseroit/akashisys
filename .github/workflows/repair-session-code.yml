name: Repair session frontend

on:
  push:
    paths:
      - '.github/workflows/repair-session-code.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
          fetch-depth: 0

      - name: Patch SessionsPage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/SessionsPage.tsx')
          text = path.read_text()

          text = re.sub(r'  async function fetchAllSessions\(\) \{.*?\n  \}\n\n  useEffect\(\(\) => \{ loadData\(\); \}, \[\]\);', '''  async function fetchAllSessions() {\n    const { data, error } = await supabase\n      .from("route_sessions")\n      .select("*")\n      .order("session_date", { ascending: false })\n      .order("created_at", { ascending: false });\n    if (error) throw error;\n    return data || [];\n  }\n\n  useEffect(() => { loadData(); }, []);''', text, count=1, flags=re.S)

          text = text.replace('''      // Determine which field route_sessions uses for the session date\n      await getSessionDateField();\n\n''', '', 1)
          text = text.replace('''      // Load today's session from route_sessions table\n      const existing = await fetchSessionForDate(today);\n\n      if (existing) {\n        setTodaySession(existing);\n      } else {\n        // Create pending session for today\n        const created = await insertSession("pending");\n        setTodaySession(created);\n      }''', '''      // Load today's session from route_sessions table\n      const existing = await fetchSessionForDate(today);\n      const sessionForToday = existing || await insertSession("pending");\n      setTodaySession(sessionForToday);''', text, 1)
          text = text.replace('.eq("session_id", todaySession?.id);', '.eq("session_id", sessionForToday.id);', 1)
          text = text.replace('  const [sessionDateField, setSessionDateField] = useState<"date" | "session_date" | null>(null);\n', '', 1)

          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SessionsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete session frontend repair"
          git push origin HEAD:pos-repair
