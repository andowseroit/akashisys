name: Finalize SessionsPage
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SessionsPage.tsx')
          s = p.read_text()
          broken = '  setTodaySession(sessionForToday); else {\n        // Create pending session for today\n        const created = await insertSession("pending");\n        setTodaySession(created);\n      }'
          if broken not in s:
              raise SystemExit('broken session block not found')
          s = s.replace(broken, '  setTodaySession(sessionForToday);', 1)
          if 'const isMissingRelationError' not in s:
              marker = '  async function fetchSessionForDate(date: string) {'
              helper = '''  const isMissingRelationError = (error: any) => {\n    const raw = error?.message || error?.msg || error?.details || error?.hint || error;\n    const message = String(raw || "").toLowerCase();\n    return message.includes("relation") || message.includes("not found") || (error as any)?.status === 404;\n  };\n\n'''
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
      - name: Build check
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SessionsPage.tsx
          git commit -m 'fix: finalize SessionsPage compilation' || exit 0
          git push origin HEAD:pos-repair