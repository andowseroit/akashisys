name: repair-pages
on:
  push:
    branches: [pos-repair]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-repair
          fetch-depth: 1
      - name: Patch Outstanding and Sessions pages
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/OutstandingPage.tsx')
          s = p.read_text()
          s = s.replace('supabase.from("sales").select("shop_id, total_amount, quantity, unit_price, sold_at")', 'supabase.from("sales").select("shop_id, total_amount, quantity, unit_price, sold_at").is("voided_at", null)')
          s = s.replace('supabase.from("payments").select("shop_id, amount, paid_at, payment_type, notes")', 'supabase.from("payments").select("shop_id, amount, paid_at, payment_type, notes").is("voided_at", null)')
          s = s.replace('supabase.from("returns").select("shop_id, quantity, unit_price, returned_at")', 'supabase.from("returns").select("shop_id, quantity, unit_price, returned_at").is("voided_at", null)')
          s = s.replace('supabase.from("sales").select("*, products(name, size_kg)").eq("shop_id", shopId)', 'supabase.from("sales").select("*, products(name, size_kg)").eq("shop_id", shopId).is("voided_at", null)')
          s = s.replace('supabase.from("payments").select("*").eq("shop_id", shopId)', 'supabase.from("payments").select("*").eq("shop_id", shopId).is("voided_at", null)')
          s = s.replace('supabase.from("returns").select("*, products(name)").eq("shop_id", shopId)', 'supabase.from("returns").select("*, products(name)").eq("shop_id", shopId).is("voided_at", null)')
          p.write_text(s)

          p = Path('src/pages/SessionsPage.tsx')
          s = p.read_text()
          s = s.replace('  const [selectedDate, setSelectedDate] = useState<string | null>(null);', '  const [selectedDate, setSelectedDate] = useState<string | null>(null);\n  const [selectedSessionId, setSelectedSessionId] = useState<string | null>(null);')
          s = s.replace('if (selectedDate === today) loadSessionDetails(today).catch(() => {});', 'if (selectedSessionId) loadSessionDetails(selectedSessionId).catch(() => {});')
          s = s.replace('if (selectedDate && recDay === selectedDate) {\n          loadSessionDetails(selectedDate).catch(() => {});', 'if (selectedSessionId && recDay === selectedDate) {\n          loadSessionDetails(selectedSessionId).catch(() => {});')
          s = s.replace('  }, [selectedDate]);', '  }, [selectedDate, selectedSessionId]);')
          old = '''  async function loadSessionDetails(date: string) {\n    if (!date) return;\n    setDetailsLoading(true);\n    setSelectedDate(date);\n    try {\n      const start = `${date}T00:00:00`;\n      const end = `${date}T23:59:59`;\n\n      const [{ data: sales }, { data: payments }, { data: expenses }, { data: returns }] =\n        await Promise.all([\n          supabase.from("sales")\n            .select("*, products(name, size_kg), shops(name)")\n            .gte("sold_at", start).lte("sold_at", end)\n            .order("sold_at", { ascending: false }),\n          supabase.from("payments")\n            .select("*, shops(name)")\n            .gte("paid_at", start).lte("paid_at", end)\n            .order("paid_at", { ascending: false }),\n          supabase.from("expenses")\n            .select("*")\n            .gte("spent_at", start).lte("spent_at", end),\n          supabase.from("returns")\n            .select("*, products(name), shops(name)")\n            .gte("returned_at", start).lte("returned_at", end),\n        ]);\n\n      setSessionDetails({ date, sales: sales || [], payments: payments || [], expenses: expenses || [], returns: returns || [] });\n    } catch (err: any) {\n      setMessage("Error loading details: " + err.message);\n    } finally {\n      setDetailsLoading(false);\n    }\n  }'''
          new = '''  async function loadSessionDetails(sessionId: string) {\n    if (!sessionId) return;\n    setDetailsLoading(true);\n    setSelectedSessionId(sessionId);\n    try {\n      const { data: session, error: sessionError } = await supabase\n        .from("route_sessions")\n        .select("id, session_date")\n        .eq("id", sessionId)\n        .single();\n      if (sessionError) throw sessionError;\n      const date = session.session_date;\n\n      const [{ data: sales, error: salesError }, { data: payments, error: paymentsError }, { data: expenses, error: expensesError }, { data: returns, error: returnsError }] =\n        await Promise.all([\n          supabase.from("sales").select("*, products(name, size_kg), shops(name)").eq("session_id", sessionId).is("voided_at", null).order("sold_at", { ascending: false }),\n          supabase.from("payments").select("*, shops(name)").eq("session_id", sessionId).is("voided_at", null).order("paid_at", { ascending: false }),\n          supabase.from("expenses").select("*").eq("session_id", sessionId).is("voided_at", null).order("spent_at", { ascending: false }),\n          supabase.from("returns").select("*, products(name), shops(name)").eq("session_id", sessionId).is("voided_at", null).order("returned_at", { ascending: false }),\n        ]);\n      const error = salesError || paymentsError || expensesError || returnsError;\n      if (error) throw error;\n      setSessionDetails({ date, sales: sales || [], payments: payments || [], expenses: expenses || [], returns: returns || [] });\n    } catch (err: any) {\n      setMessage("Error loading details: " + err.message);\n    } finally {\n      setDetailsLoading(false);\n    }\n  }'''
          if old not in s:
              raise SystemExit('expected SessionsPage loadSessionDetails block not found')
          s = s.replace(old, new)
          s = s.replace('onClick={() => { setSelectedDate(null); setSessionDetails(null); }}', 'onClick={() => { setSelectedDate(null); setSelectedSessionId(null); setSessionDetails(null); }}')
          s = s.replace('onClick={() => loadSessionDetails(sessionDate)}', 'onClick={() => loadSessionDetails(s.id)}')
          p.write_text(s)
          PY
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/OutstandingPage.tsx src/pages/SessionsPage.tsx
          git diff --cached --quiet || git commit -m "fix: scope outstanding and session reports correctly"
          git push origin pos-repair
