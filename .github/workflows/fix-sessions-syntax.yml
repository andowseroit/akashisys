name: Fix SessionsPage
on:
  workflow_dispatch:
  push:
    branches: [pos-repair]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SessionsPage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SessionsPage.tsx')
          s = p.read_text()
          old = '''      // Load today's session from route_sessions table
  const existing = await fetchSessionForDate(today);
  const sessionForToday = existing || await insertSession("pending");
  setTodaySession(sessionForToday); else {
        // Create pending session for today
        const created = await insertSession("pending");
        setTodaySession(created);
      }
'''
          new = '''      // Load today's session from route_sessions table.
      // The session is scoped to the signed-in driver and today's Colombo business date.
      const existing = await fetchSessionForDate(today);
      const sessionForToday = existing || await insertSession("pending");
      setTodaySession(sessionForToday);
'''
          if old not in s:
              raise SystemExit('expected broken loadData block not found')
          s = s.replace(old, new, 1)
          helper = '''\n  const isMissingRelationError = (error: any) => {\n    const raw = error?.message || error?.msg || error?.details || error?.hint || error;\n    const message = String(raw || "").toLowerCase();\n    return message.includes("relation") || message.includes("not found") || (error as any)?.status === 404;\n  };\n'''
          marker = '  async function fetchSessionForDate(date: string) {'
          if 'const isMissingRelationError' not in s:
              s = s.replace(marker, helper + '\n' + marker, 1)
          s = s.replace('        const sessionDate = normalizeSessionDate(todaySession) || today;\n', '', 1)
          s = s.replace('        .on("postgres_changes", { event: "INSERT", schema: "public", table: t }, handlePayload)\n', '        .on("postgres_changes", { event: "*", schema: "public", table: t }, handlePayload)\n', 1)
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          test ! -f package-lock.json || npm ci --ignore-scripts
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SessionsPage.tsx
          git diff --cached --quiet || git commit -m "fix: repair SessionsPage session lifecycle"
          git push